<html lang="en">

<body>

<form action="view.html" method="get" role="search" aria-label="Sky position">

<div class="joined joined-lg">
<input class="field" id="where" name="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">

</div>
</form>
<p><a href="lemmon.html" data-target="lemmon">COMET LEMMON</a></p>
</main>
<script type="module">
import { mountSuggest } from './js/ui/suggest.js';
const form = document.querySelector('form');
const go = new URLSearchParams(location.search).has('stay') ? (href) => { window.__went = href; } : undefined;
window.__suggest = mountSuggest(form, go ? { go } : {});
</script>
